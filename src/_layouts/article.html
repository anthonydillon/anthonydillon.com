<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
    {% include head.html %}
  </head>
  <body>
    <div class="layout">
      {% include navigation.njk %}
      <main class="l-main">
        <article class="l-content l-content--narrow p-article">
          <nav class="p-breadcrumb" aria-label="Breadcrumbs">
            <a class="p-breadcrumb__link" href="/">Home</a>
            <span class="p-breadcrumb__separator" aria-hidden="true">/</span>
            <span class="p-breadcrumb__current" aria-current="page">{{ title }}</span>
          </nav>
          <h1>{{ title }}</h1>
          <div class="p-article__tags">
            {% for tag in tags %}
            {% if tag != 'post' %}
            <a class="p-tag p-tag--highlight" href="/{{ tag }}/">{{ tag }}</a>
            {% endif %}
            {% endfor %}
          </div>
          <div class="p-article__body">{{ content | safe }}</div>
        </article>
      </main>
    </div>
  </body>
</html>
